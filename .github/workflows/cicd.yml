
name: NILUBRAIN AI CI-CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign and Release NILUBRAIN
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout Source
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4. Restore Solution
      - name: Restore Solution
        shell: pwsh
        run: |
          dotnet restore NILUBRAIN_AI_App.sln -r win-x64

          if ($LASTEXITCODE -ne 0) {
            throw "Solution restore failed!"
          }

      # 5. Build API
      - name: Build API
        shell: pwsh
        run: |
          dotnet build NILUBRAIN.API/NILUBRAIN.API.csproj `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            throw "API build failed!"
          }

      # 6. Build MSIX Package
      - name: Build MSIX Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild NILUBRAIN.Package/NILUBRAIN.Package.wapproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=false `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX build failed!"
          }

          Write-Host "MSIX BUILD SUCCESSFUL!"

      # 7. Read Package Version
      - name: Read Package Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          [xml]$manifest = Get-Content "NILUBRAIN.Package/Package.appxmanifest"

          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)

          $ns.AddNamespace(
            "a",
            "http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          )

          $identity = $manifest.SelectSingleNode("//a:Identity", $ns)

          if (!$identity) {
            throw "Package Identity not found!"
          }

          $version = $identity.GetAttribute("Version")
          $name = $identity.GetAttribute("Name")
          $publisher = $identity.GetAttribute("Publisher")

          if (!$version -or !$name -or !$publisher) {
            throw "Package manifest information is incomplete!"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "publisher=$publisher" >> $env:GITHUB_OUTPUT

          Write-Host "Package Version: $version"

      # 8. Decode Certificate
      - name: Decode MSIX Certificate
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            throw "MSIX_CERTIFICATE_BASE64 secret is missing!"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "NILUBRAIN.pfx"

          $cleanBase64 = $env:CERT_BASE64 -replace '\s', ''

          try {
            $bytes = [Convert]::FromBase64String($cleanBase64)
          }
          catch {
            throw "Invalid certificate Base64 data!"
          }

          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)

          if (!(Test-Path $pfxPath)) {
            throw "PFX creation failed!"
          }

          Write-Host "Certificate decoded successfully!"

      # 9. Sign and Verify MSIX
      - name: Sign MSIX Package
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 10
        env:
          CERT_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          # Validate Password

          $pass = $env:CERT_PASSWORD

          if ([string]::IsNullOrWhiteSpace($pass)) {
            throw "Certificate password is missing!"
          }

          # Package Version

          $version = "${{ steps.version.outputs.version }}"

          # Locate MSIX

          $searchPath = Join-Path $env:GITHUB_WORKSPACE "NILUBRAIN.Package"

          $packages = @(
            Get-ChildItem -Path $searchPath -Recurse -Filter "*.msix" |
            Where-Object {
              $_.FullName -notmatch '[\\/]Dependencies[\\/]'
            } |
            Sort-Object LastWriteTime -Descending
          )

          if ($packages.Count -eq 0) {
            throw "MSIX package not found!"
          }

          $msix = $packages[0]

          Write-Host "Found MSIX: $($msix.FullName)"

          # Copy MSIX

          $output = Join-Path $env:RUNNER_TEMP "NILUBRAIN.Package_${version}_x64.msix"

          Copy-Item -LiteralPath $msix.FullName -Destination $output -Force

          if (!(Test-Path $output)) {
            throw "MSIX copy failed!"
          }

          # Load PFX

          $pfx = Join-Path $env:RUNNER_TEMP "NILUBRAIN.pfx"

          if (!(Test-Path $pfx)) {
            throw "PFX not found!"
          }

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfx,
            $pass,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )

          try {

            # Validate Certificate

            Write-Host "Certificate Thumbprint: $($cert.Thumbprint)"

            if ($cert.Thumbprint -ne "C7B66D942723AE1D6D3B5B7F05E82CBE11E151C6") {
              throw "Certificate thumbprint mismatch!"
            }

            if (!$cert.HasPrivateKey) {
              throw "Certificate private key missing!"
            }

            Write-Host "Certificate validation successful!"

            # Export Public Certificate

            $cerPath = Join-Path $env:RUNNER_TEMP "NILUBRAIN.cer"

            $certBytes = $cert.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert
            )

            [System.IO.File]::WriteAllBytes($cerPath, $certBytes)

            # Install Trusted Root for this runner

            Write-Host "Installing Trusted Root certificate..."

            Import-Certificate `
              -FilePath $cerPath `
              -CertStoreLocation "Cert:\CurrentUser\Root" `
              -ErrorAction Stop | Out-Null

            $trustedCert = Get-ChildItem Cert:\CurrentUser\Root |
              Where-Object {
                $_.Thumbprint -eq $cert.Thumbprint
              }

            if (!$trustedCert) {
              throw "Trusted Root installation failed!"
            }

            Write-Host "Trusted Root installation successful!"

            # Locate SignTool

            $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

            $signTools = @(
              Get-ChildItem -Path $sdk -Recurse -Filter "signtool.exe" |
              Where-Object {
                $_.FullName -match '[\\/]x64[\\/]signtool\.exe$'
              } |
              Sort-Object FullName -Descending
            )

            if ($signTools.Count -eq 0) {
              throw "SignTool not found!"
            }

            $signTool = $signTools[0].FullName

            Write-Host "Using SignTool: $signTool"

            # Sign MSIX

            Write-Host "Starting MSIX signing..."

            & $signTool sign `
              /fd SHA256 `
              /f $pfx `
              /p $pass `
              $output

            if ($LASTEXITCODE -ne 0) {
              throw "MSIX signing failed: $LASTEXITCODE"
            }

            Write-Host "MSIX SIGNED SUCCESSFULLY!"

            # Verify Signature

            Write-Host "Starting signature verification..."

            & $signTool verify /pa /v $output

            $verifyExitCode = $LASTEXITCODE

            if ($verifyExitCode -ne 0) {
              throw "Signature verification failed: $verifyExitCode"
            }

            Write-Host "SIGNATURE VERIFIED SUCCESSFULLY!"

            # Final Validation

            $signedFile = Get-Item $output

            Write-Host "Version: $version"
            Write-Host "Signed File: $($signedFile.FullName)"
            Write-Host "Size: $($signedFile.Length) bytes"

          }
          finally {
            $cert.Dispose()
          }

      # 10. Generate AppInstaller
      - name: Generate AppInstaller
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.version.outputs.version }}"
          $packageName = "${{ steps.version.outputs.name }}"
          $publisher = "${{ steps.version.outputs.publisher }}"

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/v$version"

          $doc = New-Object System.Xml.XmlDocument

          $declaration = $doc.CreateXmlDeclaration("1.0", "utf-8", $null)

          $doc.AppendChild($declaration) | Out-Null

          $ns = "http://schemas.microsoft.com/appx/appinstaller/2021"

          $app = $doc.CreateElement("AppInstaller", $ns)

          $app.SetAttribute("Version", $version)
          $app.SetAttribute("Uri", "$baseUrl/NILUBRAIN.appinstaller")

          $doc.AppendChild($app) | Out-Null

          # Main Package

          $main = $doc.CreateElement("MainPackage", $ns)

          $main.SetAttribute("Name", $packageName)
          $main.SetAttribute("Publisher", $publisher)
          $main.SetAttribute("Version", $version)
          $main.SetAttribute("ProcessorArchitecture", "x64")

          $main.SetAttribute(
            "Uri",
            "$baseUrl/NILUBRAIN.Package_${version}_x64.msix"
          )

          $app.AppendChild($main) | Out-Null

          # Update Settings

          $settings = $doc.CreateElement("UpdateSettings", $ns)

          $launch = $doc.CreateElement("OnLaunch", $ns)

          $launch.SetAttribute("HoursBetweenUpdateChecks", "12")
          $launch.SetAttribute("ShowPrompt", "true")
          $launch.SetAttribute("UpdateBlocksActivation", "false")

          $settings.AppendChild($launch) | Out-Null

          $background = $doc.CreateElement("AutomaticBackgroundTask", $ns)

          $settings.AppendChild($background) | Out-Null

          $app.AppendChild($settings) | Out-Null

          # Save XML

          $file = Join-Path $env:RUNNER_TEMP "NILUBRAIN.appinstaller"

          $writerSettings = New-Object System.Xml.XmlWriterSettings

          $writerSettings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $writerSettings.Indent = $true

          $writer = [System.Xml.XmlWriter]::Create(
            $file,
            $writerSettings
          )

          try {
            $doc.Save($writer)
          }
          finally {
            $writer.Dispose()
          }

          if (!(Test-Path $file)) {
            throw "AppInstaller generation failed!"
          }

          Write-Host "AppInstaller generated successfully!"

      # 11. Publish GitHub Release
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NILUBRAIN AI v${{ steps.version.outputs.version }}
          target_commitish: master

          files: |
            ${{ runner.temp }}/NILUBRAIN.Package_${{ steps.version.outputs.version }}_x64.msix
            ${{ runner.temp }}/NILUBRAIN.appinstaller

          body: |
            # NILUBRAIN AI v${{ steps.version.outputs.version }}

            New automated Windows desktop release.

            ## Installation

            Download NILUBRAIN.appinstaller and open it with Windows App Installer.

            ## Platform

            Windows x64

            Package format: MSIX

            Automatic update checks: Every 12 hours.

          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true

      # 12. Upload Build Artifacts
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NILUBRAIN-Build-Artifacts

          path: |
            NILUBRAIN.API/bin/Release/
            NILUBRAIN.WPF/bin/Release/
            ${{ runner.temp }}/NILUBRAIN.Package_*.msix
            ${{ runner.temp }}/NILUBRAIN.appinstaller

          if-no-files-found: ignore
