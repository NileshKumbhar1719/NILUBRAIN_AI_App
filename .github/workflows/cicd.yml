name: NILUBRAIN AI CI-CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign and Release NILUBRAIN
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout Source Code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Setup Visual Studio MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4. Restore Entire Solution
      - name: Restore Solution
        run: dotnet restore NILUBRAIN_AI_App.sln -r win-x64

      # 5. Build API
      - name: Build API
        run: dotnet build NILUBRAIN.API/NILUBRAIN.API.csproj --configuration Release --no-restore

      # 6. Build WPF and MSIX Package
      - name: Build MSIX Package
        shell: pwsh
        run: |
          msbuild NILUBRAIN.Package/NILUBRAIN.Package.wapproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=false `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

      # 7. Read Package Version from Manifest
      - name: Read Package Version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "NILUBRAIN.Package/Package.appxmanifest"

          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("a", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")

          $identity = $manifest.SelectSingleNode("//a:Identity", $ns)

          $version = $identity.GetAttribute("Version")
          $name = $identity.GetAttribute("Name")
          $publisher = $identity.GetAttribute("Publisher")

          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "publisher=$publisher" >> $env:GITHUB_OUTPUT

          Write-Host "Package Version: $version"

      # 8. Decode Signing Certificate
      - name: Decode MSIX Certificate
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            throw "MSIX_CERTIFICATE_BASE64 secret is missing"
          }

          $pfxPath = "$env:RUNNER_TEMP\NILUBRAIN.pfx"
          $cleanBase64 = $env:CERT_BASE64 -replace '\s', ''

          try {
              $bytes = [Convert]::FromBase64String($cleanBase64)
          } catch {
              throw "Failed to convert CERT_BASE64. Ensure the secret is a single continuous Base64 string. Error: $_"
          }

          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Write-Host "Certificate decoded successfully"

     # 9. Locate and Sign MSIX (Fixed: No Backticks, Clean & Robust)
      - name: Sign MSIX Package
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 8
        env:
          CERT_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Write-Host "Target Version: $version"

          # बकटीक न वापरता सरळ सोपी कमांड
          $workspace = "$env:GITHUB_WORKSPACE".Replace('\', '/')
          $searchPath = "$workspace/NILUBRAIN.Package"
          Write-Host "Searching for MSIX in: $searchPath"

          $packages = Get-ChildItem -Path $searchPath -Recurse -Filter "*.msix"
          if (!$packages) {
            throw "MSIX package not found in $searchPath"
          }

          $msix = $packages | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$msix) {
            throw "Main MSIX package not found"
          }
          Write-Host "Found main package: $($msix.FullName)"

          $output = "$env:RUNNER_TEMP\NILUBRAIN.Package_$($version)_x64.msix"
          Copy-Item -Path $msix.FullName -Destination $output -Force

          $pfx = "$env:RUNNER_TEMP\NILUBRAIN.pfx"
          if (!(Test-Path $pfx)) {
            throw "Decoded PFX certificate not found at $pfx"
          }

          $cert = Get-PfxCertificate -FilePath $pfx
          Write-Host "Certificate Thumbprint: $($cert.Thumbprint)"
          if ($cert.Thumbprint -ne "C7B66D942723AE1D6D3B5B7F05E82CBE11E151C6") {
            throw "Certificate thumbprint mismatch"
          }

          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = Get-ChildItem -Path $sdk -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          
          if (!$signTool) {
            throw "SignTool not found"
          }
          Write-Host "Using SignTool at: $($signTool.FullName)"

          Write-Host "Signing MSIX package in quiet mode..."
          $pass = $env:CERT_PASSWORD
          
          & $signTool.FullName sign /q /fd SHA256 /f $pfx /p "$pass" /tr http://timestamp.digicert.com /td SHA256 $output

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signing failed with exit code $LASTEXITCODE"
          }
          Write-Host "MSIX signed successfully!"

          Write-Host "Verifying signature..."
          & $signTool.FullName verify /pa /v $output

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signature verification failed"
          }
          Write-Host "Signature verified successfully!"
          
      # 10. Generate AppInstaller
      - name: Generate AppInstaller
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/v$version"

          $doc = New-Object System.Xml.XmlDocument

          $declaration = $doc.CreateXmlDeclaration("1.0", "utf-8", $null)
          $doc.AppendChild($declaration) | Out-Null

          $ns = "http://schemas.microsoft.com/appx/appinstaller/2021"

          $app = $doc.CreateElement("AppInstaller", $ns)

          $app.SetAttribute("Version", $version)
          $app.SetAttribute("Uri", "$baseUrl/NILUBRAIN.appinstaller")

          $doc.AppendChild($app) | Out-Null

          $main = $doc.CreateElement("MainPackage", $ns)

          $main.SetAttribute("Name", "${{ steps.version.outputs.name }}")
          $main.SetAttribute("Publisher", "${{ steps.version.outputs.publisher }}")
          $main.SetAttribute("Version", $version)
          $main.SetAttribute("ProcessorArchitecture", "x64")
          $main.SetAttribute("Uri", "$baseUrl/NILUBRAIN.Package_${version}_x64.msix")

          $app.AppendChild($main) | Out-Null

          $settings = $doc.CreateElement("UpdateSettings", $ns)

          $launch = $doc.CreateElement("OnLaunch", $ns)
          $launch.SetAttribute("HoursBetweenUpdateChecks", "12")
          $launch.SetAttribute("ShowPrompt", "true")
          $launch.SetAttribute("UpdateBlocksActivation", "false")

          $settings.AppendChild($launch) | Out-Null

          $background = $doc.CreateElement("AutomaticBackgroundTask", $ns)
          $settings.AppendChild($background) | Out-Null

          $app.AppendChild($settings) | Out-Null

          $file = "$env:RUNNER_TEMP\NILUBRAIN.appinstaller"

          $writerSettings = New-Object System.Xml.XmlWriterSettings
          $writerSettings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $writerSettings.Indent = $true

          $writer = [System.Xml.XmlWriter]::Create($file, $writerSettings)

          try {
            $doc.Save($writer)
          }
          finally {
            $writer.Dispose()
          }

          Write-Host "AppInstaller XML generated successfully"

      # 11. Publish GitHub Release
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NILUBRAIN AI v${{ steps.version.outputs.version }}
          target_commitish: master
          files: |
            ${{ runner.temp }}/NILUBRAIN.Package_${{ steps.version.outputs.version }}_x64.msix
            ${{ runner.temp }}/NILUBRAIN.appinstaller
          body: |
            # NILUBRAIN AI v${{ steps.version.outputs.version }}

            New automated Windows desktop release.

            ## Installation
            Download NILUBRAIN.appinstaller and open it with Windows App Installer.

            ## Platform
            Windows x64
            Package format: MSIX

            Automatic update checks: Every 12 hours.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true

      # 12. Upload Build Artifacts
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NILUBRAIN-Build-Logs
          path: |
            NILUBRAIN.API/bin/Release/
            NILUBRAIN.WPF/bin/Release/
          if-no-files-found: ignore