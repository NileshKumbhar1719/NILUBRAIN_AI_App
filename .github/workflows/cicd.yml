
name: NILUBRAIN AI CI-CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign and Release NILUBRAIN
    runs-on: windows-latest
    timeout-minutes: 30

    steps:

      # 1. CHECKOUT
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. SETUP DOTNET
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. SETUP MSBUILD
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4. RESTORE
      - name: Restore Solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore NILUBRAIN_AI_App.sln -r win-x64

          if ($LASTEXITCODE -ne 0) {
            throw "Solution restore failed!"
          }

          Write-Host "RESTORE SUCCESSFUL!"

      # 5. BUILD API
      - name: Build API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet build NILUBRAIN.API/NILUBRAIN.API.csproj `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            throw "API build failed!"
          }

          Write-Host "API BUILD SUCCESSFUL!"

      # 6. BUILD MSIX
      - name: Build MSIX Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild NILUBRAIN.Package/NILUBRAIN.Package.wapproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=false `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX build failed!"
          }

          Write-Host "MSIX BUILD SUCCESSFUL!"

      # 7. READ PACKAGE VERSION
      - name: Read Package Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          [xml]$manifest = Get-Content `
            "NILUBRAIN.Package/Package.appxmanifest"

          $ns = New-Object System.Xml.XmlNamespaceManager(
            $manifest.NameTable
          )

          $ns.AddNamespace(
            "a",
            "http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          )

          $identity = $manifest.SelectSingleNode("//a:Identity", $ns)

          if (!$identity) {
            throw "Package Identity not found!"
          }

          $version = $identity.GetAttribute("Version")
          $name = $identity.GetAttribute("Name")
          $publisher = $identity.GetAttribute("Publisher")

          if (!$version -or !$name -or !$publisher) {
            throw "Package manifest information missing!"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "publisher=$publisher" >> $env:GITHUB_OUTPUT

          Write-Host "Version: $version"
          Write-Host "Package: $name"
          Write-Host "Publisher: $publisher"

      # 8. DECODE CERTIFICATE
      - name: Decode MSIX Certificate
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            throw "MSIX_CERTIFICATE_BASE64 secret is missing!"
          }

          $pfxPath = Join-Path `
            $env:RUNNER_TEMP `
            "NILUBRAIN.pfx"

          $cleanBase64 = $env:CERT_BASE64 -replace '\s', ''

          try {
            $bytes = [Convert]::FromBase64String($cleanBase64)
          }
          catch {
            throw "Invalid certificate Base64!"
          }

          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            $bytes
          )

          if (!(Test-Path $pfxPath)) {
            throw "PFX creation failed!"
          }

          Write-Host "CERTIFICATE DECODED SUCCESSFULLY!"

     
     
      
      # 9. SIGN AND VERIFY MSIX
    
      - name: Sign MSIX Package
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 10
        env:
          CERT_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "STEP 1: Loading password"

          $pass = $env:CERT_PASSWORD

          if ([string]::IsNullOrWhiteSpace($pass)) {
            throw "Certificate password missing!"
          }

          $version = "${{ steps.version.outputs.version }}"

          Write-Host "STEP 2: Finding MSIX"

          $searchPath = Join-Path $env:GITHUB_WORKSPACE "NILUBRAIN.Package"

          $msix = Get-ChildItem $searchPath -Recurse -Filter "*.msix" |
            Where-Object {
              $_.FullName -notmatch '[\\/]Dependencies[\\/]'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$msix) {
            throw "MSIX not found!"
          }

          $output = Join-Path $env:RUNNER_TEMP "NILUBRAIN.Package_${version}_x64.msix"

          Copy-Item $msix.FullName $output -Force

          Write-Host "STEP 3: Loading PFX"

          $pfx = Join-Path $env:RUNNER_TEMP "NILUBRAIN.pfx"

          if (!(Test-Path $pfx)) {
            throw "PFX not found!"
          }

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfx,
            $pass,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )

          try {

            if ($cert.Thumbprint -ne "C7B66D942723AE1D6D3B5B7F05E82CBE11E151C6") {
              throw "Thumbprint mismatch!"
            }

            if (!$cert.HasPrivateKey) {
              throw "Private key missing!"
            }

            Write-Host "STEP 4: CERTIFICATE VALIDATED!"

            Write-Host "STEP 5: Finding SignTool"

            $sdk = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"

            $signTool = Get-ChildItem $sdk -Recurse -Filter signtool.exe |
              Where-Object {
                $_.FullName -match '[\\/]x64[\\/]signtool\.exe$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (!$signTool) {
              throw "SignTool not found!"
            }

            Write-Host "SignTool: $signTool"

            Write-Host "STEP 6: SIGNING MSIX"

            & $signTool sign `
              /fd SHA256 `
              /f $pfx `
              /p $pass `
              $output

            if ($LASTEXITCODE -ne 0) {
              throw "MSIX signing failed!"
            }

            Write-Host "STEP 7: SIGNING SUCCESSFUL!"

            Write-Host "STEP 8: VERIFYING SIGNATURE"

            # Verify cryptographic package signature and signer.
            # Do not treat a self-signed root trust failure as
            # successful Windows installation trust.

            & $signTool verify /pa /v $output

            $verifyCode = $LASTEXITCODE

            if ($verifyCode -ne 0) {
              Write-Warning "Windows trust verification failed."
              Write-Warning "The package was signed, but its certificate is not trusted by this runner."
              Write-Warning "Use a trusted code-signing certificate for production distribution."
            }
            else {
              Write-Host "SIGNATURE AND TRUST VERIFIED!"
            }

            Write-Host "STEP 9: FINAL FILE VALIDATION"

            $file = Get-Item $output

            if ($file.Length -le 0) {
              throw "Signed MSIX is empty!"
            }

            Write-Host "================================"
            Write-Host "NILUBRAIN SIGNING COMPLETED"
            Write-Host "Version: $version"
            Write-Host "File: $output"
            Write-Host "Size: $($file.Length)"
            Write-Host "================================"

          }
          finally {
            $cert.Dispose()
          }



      # ==========================================
      # 10. GENERATE APPINSTALLER
      # ==========================================

      - name: Generate AppInstaller
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $version = "${{ steps.version.outputs.version }}"
          $packageName = "${{ steps.version.outputs.name }}"
          $publisher = "${{ steps.version.outputs.publisher }}"

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/v$version"

          $doc = New-Object System.Xml.XmlDocument

          $declaration = $doc.CreateXmlDeclaration(
            "1.0",
            "utf-8",
            $null
          )

          $doc.AppendChild($declaration) | Out-Null

          $ns = "http://schemas.microsoft.com/appx/appinstaller/2021"

          # ROOT

          $app = $doc.CreateElement("AppInstaller", $ns)

          $app.SetAttribute("Version", $version)

          $app.SetAttribute(
            "Uri",
            "$baseUrl/NILUBRAIN.appinstaller"
          )

          $doc.AppendChild($app) | Out-Null

          # MAIN PACKAGE

          $main = $doc.CreateElement("MainPackage", $ns)

          $main.SetAttribute("Name", $packageName)
          $main.SetAttribute("Publisher", $publisher)
          $main.SetAttribute("Version", $version)
          $main.SetAttribute("ProcessorArchitecture", "x64")

          $main.SetAttribute(
            "Uri",
            "$baseUrl/NILUBRAIN.Package_${version}_x64.msix"
          )

          $app.AppendChild($main) | Out-Null

          # UPDATE SETTINGS

          $settings = $doc.CreateElement("UpdateSettings", $ns)

          $launch = $doc.CreateElement("OnLaunch", $ns)

          $launch.SetAttribute(
            "HoursBetweenUpdateChecks",
            "12"
          )

          $launch.SetAttribute("ShowPrompt", "true")

          $launch.SetAttribute(
            "UpdateBlocksActivation",
            "false"
          )

          $settings.AppendChild($launch) | Out-Null

          $background = $doc.CreateElement(
            "AutomaticBackgroundTask",
            $ns
          )

          $settings.AppendChild($background) | Out-Null

          $app.AppendChild($settings) | Out-Null

          # SAVE XML

          $file = Join-Path `
            $env:RUNNER_TEMP `
            "NILUBRAIN.appinstaller"

          $writerSettings = New-Object System.Xml.XmlWriterSettings

          $writerSettings.Encoding = New-Object System.Text.UTF8Encoding($false)

          $writerSettings.Indent = $true

          $writer = [System.Xml.XmlWriter]::Create(
            $file,
            $writerSettings
          )

          try {

            $doc.Save($writer)

          }
          finally {

            $writer.Dispose()

          }

          if (!(Test-Path $file)) {
            throw "AppInstaller generation failed!"
          }

          Write-Host "APPINSTALLER GENERATED SUCCESSFULLY!"
          Write-Host "File: $file"


      # ==========================================
      # 11. VALIDATE RELEASE FILES
      # ==========================================

      - name: Validate Release Files
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          $version = "${{ steps.version.outputs.version }}"

          $msix = Join-Path `
            $env:RUNNER_TEMP `
            "NILUBRAIN.Package_${version}_x64.msix"

          $appinstaller = Join-Path `
            $env:RUNNER_TEMP `
            "NILUBRAIN.appinstaller"

          # CHECK MSIX

          if (!(Test-Path $msix)) {
            throw "Signed MSIX file missing!"
          }

          # CHECK APPINSTALLER

          if (!(Test-Path $appinstaller)) {
            throw "AppInstaller file missing!"
          }

          # CHECK FILE SIZE

          $msixFile = Get-Item $msix

          $installerFile = Get-Item $appinstaller

          if ($msixFile.Length -eq 0) {
            throw "MSIX file is empty!"
          }

          if ($installerFile.Length -eq 0) {
            throw "AppInstaller file is empty!"
          }

          # VALIDATE XML

          [xml]$xml = Get-Content $appinstaller

          if (!$xml.DocumentElement) {
            throw "Invalid AppInstaller XML!"
          }

          Write-Host "===================================="
          Write-Host "RELEASE FILES VALIDATED"
          Write-Host "MSIX: $($msixFile.FullName)"
          Write-Host "MSIX Size: $($msixFile.Length)"
          Write-Host "AppInstaller: $($installerFile.FullName)"
          Write-Host "===================================="


      # ==========================================
      # 12. PUBLISH GITHUB RELEASE
      # ==========================================

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2

        with:

          tag_name: v${{ steps.version.outputs.version }}

          name: NILUBRAIN AI v${{ steps.version.outputs.version }}

          target_commitish: master

          files: |
            ${{ runner.temp }}/NILUBRAIN.Package_${{ steps.version.outputs.version }}_x64.msix
            ${{ runner.temp }}/NILUBRAIN.appinstaller

          body: |
            # NILUBRAIN AI v${{ steps.version.outputs.version }}

            New automated Windows desktop release.

            ## Installation

            Download NILUBRAIN.appinstaller and open it using Windows App Installer.

            ## Platform

            Windows x64

            Package format: MSIX

            ## Automatic Updates

            Automatic update checks every 12 hours.

          draft: false

          prerelease: false

          fail_on_unmatched_files: true

          overwrite_files: true


      # ==========================================
      # 13. UPLOAD BUILD ARTIFACTS
      # ==========================================

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: NILUBRAIN-Build-Artifacts

          path: |
            NILUBRAIN.API/bin/Release/
            NILUBRAIN.WPF/bin/Release/
            ${{ runner.temp }}/NILUBRAIN.Package_*.msix
            ${{ runner.temp }}/NILUBRAIN.appinstaller

          if-no-files-found: ignore

          retention-days: 14
